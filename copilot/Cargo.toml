[package]
name = "magicopilot"
version = "0.1.1"
edition = "2024"
description = "Runs the unmodified GitHub Copilot CLI with the Magicodex magic circle above it"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.28.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_28"] }
serde_json = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
